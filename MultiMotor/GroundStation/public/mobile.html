<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DroneGS">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Drone GS — Mobile</title>
<style>
  :root{--bg:#0a0f14;--panel:#111a22;--border:#1e2b36;--text:#d7e3ec;--dim:#6b8299;
        --cyan:#22d3ee;--green:#34d399;--amber:#fbbf24;--red:#f87171;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(1000px 500px at 50% 0%,#0f1c26,#070b0f 70%);
            color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  header{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--border);background:#0b1218;flex-wrap:wrap}
  .imu{display:flex;gap:14px;flex:1}
  .imu .k{font-size:9px;letter-spacing:1px;color:var(--dim)}
  .imu .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  #vRoll{color:var(--cyan)} #vPitch{color:var(--green)} #vYaw{color:var(--amber)}
  .chips{display:flex;gap:6px;align-items:center}
  .chip{font-size:9px;letter-spacing:1px;border:1px solid var(--border);border-radius:6px;padding:2px 6px;color:var(--dim)}
  .chip.on{color:var(--green);border-color:var(--green)} .chip.err{color:var(--red);border-color:var(--red)}
  .batt{font-size:11px;color:var(--green);font-weight:700}

  main{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;min-height:0}
  .joybox{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
  .jl{font-size:10px;letter-spacing:1.5px;color:var(--dim);margin-top:6px}

  .pad,.wheel{position:relative;border-radius:50%;touch-action:none;
    border:2px solid var(--border);background:radial-gradient(circle at 50% 50%,#0e1a22,#0a1015 70%);
    width:min(40vw,52vh);aspect-ratio:1;max-width:100%}
  .pad{border-color:#1f3d4a}
  .pad::before,.pad::after{content:"";position:absolute;background:#16222c}
  .pad::before{left:50%;top:8%;bottom:8%;width:1px}
  .pad::after{top:50%;left:8%;right:8%;height:1px}
  .wheel{box-shadow:inset 0 0 24px rgba(34,211,238,.10)}
  .wheel .rim{position:absolute;inset:12%;border:1px dashed #1b2b37;border-radius:50%}
  .wheel .tick{position:absolute;left:50%;top:6%;width:2px;height:10px;background:var(--amber);transform:translateX(-1px)}

  .knob{position:absolute;left:50%;top:50%;border-radius:50%;will-change:transform;
    border:2px solid var(--cyan);background:#0b2730;box-shadow:0 0 16px rgba(34,211,238,.4)}
  .pad .knob{width:56px;height:56px;margin:-30px 0 0 -30px}
  .wheel .knob{width:40px;height:40px;margin:-22px 0 0 -22px;border-color:var(--amber);background:#2a2205;box-shadow:0 0 16px rgba(251,191,36,.45)}
  .pad .knob::after{content:"✛";position:absolute;inset:0;display:grid;place-items:center;color:var(--cyan);font-size:18px}

  /* centre mini drone */
  .center{flex:0 0 26vw;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-width:0}
  .craftWrap{position:relative;width:min(24vw,30vh);aspect-ratio:1;display:grid;place-items:center;perspective:600px}
  #mini{width:88%;will-change:transform;transform-origin:center;filter:drop-shadow(0 8px 12px rgba(0,0,0,.6))}
  #moveArrow{position:absolute;inset:0;margin:auto;width:92%;height:92%;opacity:0;transform:rotate(0deg);pointer-events:none}
  .center .cl{font-size:9px;letter-spacing:1px;color:var(--dim);margin-top:2px}

  footer{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--border);background:#0b1218;flex-wrap:wrap}
  .state{font-size:13px;font-weight:800;letter-spacing:2px;padding:5px 10px;border-radius:8px;border:1px solid var(--border)}
  .state.disarmed{color:var(--dim)} .state.armed{color:var(--green);border-color:var(--green)} .state.killed{color:var(--red);border-color:var(--red)}
  .thr{display:flex;align-items:center;gap:6px;flex:1;min-width:120px}
  .thr span{font-size:9px;color:var(--amber);letter-spacing:1px}
  .thr input{flex:1;accent-color:var(--amber)}
  .thr b{font-size:12px;color:var(--amber);min-width:38px;text-align:right}
  button{font-family:inherit;font-size:11px;font-weight:700;letter-spacing:.5px;padding:8px 10px;border-radius:8px;border:2px solid;background:transparent;color:var(--text)}
  button:active{transform:scale(.96)}
  .b-arm{color:var(--green);border-color:var(--green)} .b-arm:disabled{opacity:.35}
  .b-dis{color:var(--amber);border-color:var(--amber)} .b-dis:disabled{opacity:.35}
  .b-estop{color:#fff;background:var(--red);border-color:var(--red)}
  .b-mix{color:var(--dim);border-color:var(--dim);min-width:64px} .b-mix.on{color:var(--green);border-color:var(--green);background:#0b2b22}
  .b-rec{color:var(--cyan);border-color:var(--cyan)} .b-rec:not(:disabled){animation:pulse 1.1s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(34,211,238,.6)}50%{box-shadow:0 0 0 8px rgba(34,211,238,0)}}

  #rotate{position:fixed;inset:0;display:none;place-items:center;background:#070b0f;color:var(--dim);
          font-size:14px;letter-spacing:1px;text-align:center;z-index:50}
  @media (orientation:portrait){#rotate{display:grid}}
  #toast{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--green);color:#052c1e;
         font-weight:800;font-size:12px;padding:8px 16px;border-radius:9px;opacity:0;transition:.2s;pointer-events:none}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="imu">
      <div><div class="k">ROLL</div><div class="v" id="vRoll">0.0°</div></div>
      <div><div class="k">PITCH</div><div class="v" id="vPitch">0.0°</div></div>
      <div><div class="k">YAW</div><div class="v" id="vYaw">0.0°</div></div>
    </div>
    <div class="chips">
      <span class="chip" id="cWs">WS</span>
      <span class="chip" id="cSer">SER</span>
      <span class="chip" id="cFx">FX</span>
      <span class="batt" id="batt">--.--V</span>
    </div>
  </header>

  <main>
    <div class="joybox">
      <div class="pad" id="padAngle"><div class="knob"></div></div>
      <div class="jl">ANGLE · roll/pitch</div>
    </div>

    <div class="center">
      <div class="craftWrap">
        <svg id="mini" viewBox="-120 -120 240 240">
          <g stroke="#1f3d4a" stroke-width="9" stroke-linecap="round">
            <line x1="0" y1="0" x2="47.5" y2="-82.3"/><line x1="0" y1="0" x2="95" y2="0"/>
            <line x1="0" y1="0" x2="47.5" y2="82.3"/><line x1="0" y1="0" x2="-47.5" y2="82.3"/>
            <line x1="0" y1="0" x2="-95" y2="0"/><line x1="0" y1="0" x2="-47.5" y2="-82.3"/>
          </g>
          <g fill="none" stroke="rgba(34,211,238,.28)" stroke-width="6">
            <circle cx="47.5" cy="-82.3" r="30"/><circle cx="95" cy="0" r="30"/><circle cx="47.5" cy="82.3" r="30"/>
            <circle cx="-47.5" cy="82.3" r="30"/><circle cx="-95" cy="0" r="30"/><circle cx="-47.5" cy="-82.3" r="30"/>
          </g>
          <g fill="#0e1c24" stroke="#2a4553" stroke-width="2">
            <circle cx="47.5" cy="-82.3" r="14"/><circle cx="95" cy="0" r="14"/><circle cx="47.5" cy="82.3" r="14"/>
            <circle cx="-47.5" cy="82.3" r="14"/><circle cx="-95" cy="0" r="14"/><circle cx="-47.5" cy="-82.3" r="14"/>
          </g>
          <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="#12303c" stroke="#2a4553" stroke-width="2"/>
          <polygon points="0,-66 12,-46 -12,-46" fill="#f87171"/><circle cx="0" cy="0" r="6" fill="#22d3ee"/>
        </svg>
        <svg id="moveArrow" viewBox="-50 -50 100 100">
          <line x1="0" y1="0" x2="36" y2="0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
          <polygon points="36,-6 48,0 36,6" fill="#fbbf24"/>
        </svg>
      </div>
      <div class="cl">ATTITUDE</div>
    </div>

    <div class="joybox">
      <div class="wheel" id="wheelYaw"><div class="rim"></div><div class="tick"></div><div class="knob"></div></div>
      <div class="jl">YAW · steer</div>
    </div>
  </main>

  <footer>
    <span class="state disarmed" id="state">DISARMED</span>
    <div class="thr"><span>THR</span><input type="range" id="thr" min="1000" max="2000" value="1000" step="5"><b id="thrV">1000</b></div>
    <button class="b-mix on" id="mixBtn">MIX ON</button>
    <button class="b-rec" id="rec" disabled>RESET</button>
    <button class="b-arm" id="arm">ARM</button>
    <button class="b-dis" id="dis" disabled>DISARM</button>
    <button class="b-estop" id="stop">STOP</button>
  </footer>
</div>
<div id="rotate">↻ Rotate device to landscape</div>
<div id="toast">CALIBRATED</div>

<script src="controls.js"></script>
<script>
const $=id=>document.getElementById(id);
const S={imu:null,ref:{roll:0,pitch:0,yaw:0},haveRef:false,recent:[],state:0,
         mix:{on:true,thr:1000,roll:0,pitch:0,yaw:0},timer:null,lastT:0,rate:0};
let ws;
const D2R=Math.PI/180, wrap180=d=>((d+180)%360+360)%360-180;

function setChip(el,on,err){el.classList.toggle('on',on&&!err);el.classList.toggle('err',!!err);}
function connect(){ws=new WebSocket(`ws://${location.host}`);
  ws.onopen=()=>{setChip($('cWs'),true,false);};
  ws.onclose=()=>{setChip($('cWs'),false,false);setTimeout(connect,1500);};
  ws.onerror=()=>setChip($('cWs'),false,true);
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.type==='serial'){setChip($('cSer'),m.status==='connected',m.status==='error');if(m.status==='connected')setTimeout(()=>send('Q'),300);}
    else if(m.type==='e'){onImu(m);}
    else if(m.type==='telemetry'){const d=m.data;
      if(d.startsWith('B,')){const p=d.substring(2).split(',');const v=(+p[0]/1000);
        const cells=6, per=v/cells; const b=$('batt'); b.textContent=v.toFixed(2)+'V';
        b.style.color=per<3.3?'var(--red)':per<3.5?'var(--amber)':'var(--green)';}
      else if(d==='ARMED')setState(1);else if(d==='DISARMED')setState(0);else if(d==='KILLED')setState(2);else if(d==='TIMEOUT')setState(0);
    }
  };
}
connect();
function send(c){if(ws&&ws.readyState===1)ws.send(c);}

function onImu(m){S.imu=m;setChip($('cFx'),true,false);
  if(S.lastT&&m.t>S.lastT){const dt=(m.t-S.lastT)/1000;if(dt>0&&dt<0.5)S.rate=S.rate?S.rate*0.9+(1/dt)*0.1:1/dt;}
  S.lastT=m.t;S.recent.push({roll:m.roll,pitch:m.pitch,yaw:m.yaw});if(S.recent.length>40)S.recent.shift();
  if(!S.haveRef&&S.recent.length>=20)calibrate(false);}

function calibMean(a){let s=0,c=0;for(const x of a){s+=Math.sin(x*D2R);c+=Math.cos(x*D2R);}return Math.atan2(s,c)/D2R;}
function calibrate(toast){if(!S.recent.length)return;const r=S.recent.slice(-40);
  S.ref={roll:r.reduce((a,v)=>a+v.roll,0)/r.length,pitch:r.reduce((a,v)=>a+v.pitch,0)/r.length,yaw:calibMean(r.map(v=>v.yaw))};
  S.haveRef=true;if(toast){$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),800);}}

/* joysticks */
makePad($('padAngle'),(nx,ny)=>{S.mix.roll=Math.round(nx*300);S.mix.pitch=Math.round(-ny*300);});
makeWheel($('wheelYaw'),v=>{S.mix.yaw=Math.round(v*300);});

/* throttle */
$('thr').addEventListener('input',e=>{S.mix.thr=+e.target.value;$('thrV').textContent=e.target.value;});

/* state/commands */
function setState(st){S.state=st;const el=$('state');const names=['DISARMED','ARMED','KILLED'],cl=['disarmed','armed','killed'];
  el.textContent=names[st];el.className='state '+cl[st];
  $('arm').disabled=(st===1||st===2);$('dis').disabled=(st!==1);$('rec').disabled=(st!==2);
  if(st===1)startMix();else stopMix();
  if(st!==1){S.mix.roll=0;S.mix.pitch=0;S.mix.yaw=0;}}
function startMix(){if(S.timer)return;S.timer=setInterval(()=>{
  if(S.state===1)send(`X${S.mix.thr},${S.mix.roll},${S.mix.pitch},${S.mix.yaw}`);},50);}
function stopMix(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
$('arm').onclick=()=>send('A');
$('dis').onclick=()=>send('D');
$('stop').onclick=()=>send('!');
$('rec').onclick=()=>send('R');
$('mixBtn').onclick=()=>{S.mix.on=!S.mix.on;const b=$('mixBtn');b.textContent=S.mix.on?'MIX ON':'MIX OFF';b.classList.toggle('on',S.mix.on);};
setState(0);

/* render loop */
function ui(){
  if(S.imu){
    let roll=S.imu.roll,pitch=S.imu.pitch,yaw=S.imu.yaw;
    if(S.haveRef){roll=wrap180(roll-S.ref.roll);pitch=wrap180(pitch-S.ref.pitch);yaw=wrap180(yaw-S.ref.yaw);}
    $('vRoll').textContent=(roll>=0?'+':'')+roll.toFixed(1)+'°';
    $('vPitch').textContent=(pitch>=0?'+':'')+pitch.toFixed(1)+'°';
    $('vYaw').textContent=(yaw>=0?'+':'')+yaw.toFixed(1)+'°';
    const t=`perspective(600px) rotateZ(${yaw}deg) rotateX(${-pitch}deg) rotateY(${roll}deg)`;
    $('mini').style.transform=t;
    const dx=S.mix.roll, dy=-S.mix.pitch, mag=Math.min(1,Math.hypot(dx,dy)/300);
    $('moveArrow').style.transform=`rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`;
    $('moveArrow').style.opacity = mag < 0.02 ? 0 : Math.min(1, 0.25 + 0.85*mag);
  }
  requestAnimationFrame(ui);
}
requestAnimationFrame(ui);

/* PWA */
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>

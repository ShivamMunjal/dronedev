<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DroneGS">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Drone GS — Mobile</title>
<style>
  :root{--bg:#0a0f14;--panel:#0f1922;--panel2:#0c141b;--border:#1b2b36;--text:#d7e3ec;--dim:#6b8299;
        --cyan:#22d3ee;--green:#34d399;--amber:#fbbf24;--red:#f87171;--blue:#60a5fa;--violet:#a78bfa;--pink:#f472b6}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;color:var(--text);
    background:radial-gradient(1000px 520px at 50% -10%,#10202b,#070b0f 72%);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none;user-select:none}
  #app{display:flex;flex-direction:column;height:100dvh;
       padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}

  /* header */
  header{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,#0c161d,#0a1218);flex-wrap:wrap}
  .imu{display:flex;gap:14px;flex:1;min-width:0}
  .imu .k,.pmu .k{font-size:8px;letter-spacing:1.5px;color:var(--dim)}
  .imu .v{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
  #vRoll{color:var(--cyan)} #vPitch{color:var(--green)} #vYaw{color:var(--amber)}
  .pmu{display:flex;gap:12px;align-items:center;margin-right:2px}
  .pmu .pv{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--green);line-height:1}
  .chips{display:flex;gap:5px;align-items:center}
  .chip{font-size:9px;letter-spacing:1px;border:1px solid var(--border);border-radius:6px;padding:3px 7px;color:var(--dim);
    background:transparent;font-family:inherit}
  .chip.on{color:var(--green);border-color:var(--green);background:#0b2b22}
  .chip.err{color:var(--red);border-color:var(--red)}
  .chip.tog{color:var(--dim)} .chip.tog.on{color:var(--cyan);border-color:var(--cyan);background:#062a33}
  .chip.fs{font-size:14px;padding:1px 8px}

  main{flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 12px;min-height:0}
  .joybox{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
  .jl{font-size:9px;letter-spacing:1.5px;color:var(--dim);margin-top:5px}

  .pad,.wheel{position:relative;border-radius:50%;touch-action:none;
    border:2px solid var(--border);background:radial-gradient(circle at 50% 45%,#0e1a22,#090f14 72%);
    width:min(38vw,50vh);aspect-ratio:1;max-width:100%}
  .pad{border-color:#1f3d4a}
  .pad::before,.pad::after{content:"";position:absolute;background:#152430}
  .pad::before{left:50%;top:7%;bottom:7%;width:1px}
  .pad::after{top:50%;left:7%;right:7%;height:1px}
  .wheel{box-shadow:inset 0 0 26px rgba(34,211,238,.10)}
  .wheel .rim{position:absolute;inset:12%;border:1px dashed #1b2b37;border-radius:50%}
  .wheel .tick{position:absolute;left:50%;top:5%;width:2px;height:9px;background:var(--amber);transform:translateX(-1px)}

  .knob{position:absolute;left:50%;top:50%;border-radius:50%;will-change:transform;
    border:2px solid var(--cyan);background:#0b2730;box-shadow:0 0 16px rgba(34,211,238,.4)}
  .pad .knob{width:56px;height:56px;margin:-30px 0 0 -30px}
  .wheel .knob{width:40px;height:40px;margin:-22px 0 0 -22px;border-color:var(--amber);background:#2a2205;box-shadow:0 0 16px rgba(251,191,36,.45)}
  .pad .knob::after{content:"✛";position:absolute;inset:0;display:grid;place-items:center;color:var(--cyan);font-size:18px}

  /* centre */
  .center{flex:0 0 27vw;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0}
  .craftWrap{position:relative;width:min(23vw,28vh);aspect-ratio:1;display:grid;place-items:center;perspective:600px}
  #mini{width:88%;will-change:transform;transform-origin:center;filter:drop-shadow(0 8px 12px rgba(0,0,0,.6))}
  #moveArrow{position:absolute;inset:0;margin:auto;width:92%;height:92%;opacity:0;transform:rotate(0deg);pointer-events:none}
  .cl{font-size:8px;letter-spacing:1.5px;color:var(--dim);margin-top:2px}
  .cbtns{display:flex;flex-direction:column;gap:5px;margin-top:5px;width:100%;align-items:center}
  .b-cal{font-size:10px;font-weight:800;letter-spacing:1px;padding:6px 12px;color:var(--green);border:2px solid var(--green);
    border-radius:8px;background:transparent;font-family:inherit}
  .b-reset{font-size:10px;font-weight:800;letter-spacing:1px;padding:6px 12px;color:#fff;background:#7f1d1d;border:2px solid var(--red);
    border-radius:8px;font-family:inherit}
  .b-cal:active,.b-reset:active{transform:scale(.96)}

  /* matrix strip */
  .matrix{display:flex;align-items:center;gap:10px;padding:4px 12px 6px;border-top:1px solid var(--border);
    background:linear-gradient(180deg,#0a1218,#0c161d)}
  .mhead{font-size:8px;letter-spacing:1.5px;color:var(--dim);writing-mode:vertical-rl;transform:rotate(180deg);
    border-right:1px solid var(--border);padding-right:6px}
  .mcells{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;flex:1}
  .mc2{background:var(--panel2);border:1px solid var(--border);border-radius:7px;padding:3px 5px;min-width:0}
  .mc2 .t{font-size:8px;color:var(--dim);letter-spacing:1px;display:flex;justify-content:space-between}
  .mc2 .v{font-size:13px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--cyan)}
  .mc2 .bar{height:3px;border-radius:2px;background:#132029;margin-top:2px;overflow:hidden}
  .mc2 .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--green))}
  .mformula{font-size:8px;color:var(--dim);letter-spacing:.5px;max-width:34%;line-height:1.35}
  .mformula b{color:var(--text)}

  /* footer */
  footer{display:flex;align-items:center;gap:7px;padding:5px 12px;border-top:1px solid var(--border);
    background:linear-gradient(180deg,#0c161d,#0a1218);flex-wrap:wrap}
  .state{font-size:12px;font-weight:800;letter-spacing:2px;padding:4px 9px;border-radius:7px;border:1px solid var(--border)}
  .state.disarmed{color:var(--dim)} .state.armed{color:var(--green);border-color:var(--green)} .state.killed{color:var(--red);border-color:var(--red)}
  .thr{display:flex;align-items:center;gap:6px;flex:1;min-width:110px}
  .thr span{font-size:8px;color:var(--amber);letter-spacing:1px}
  .thr input{flex:1;accent-color:var(--amber)}
  .thr b{font-size:12px;color:var(--amber);min-width:36px;text-align:right;font-variant-numeric:tabular-nums}
  button{font-family:inherit;font-size:10px;font-weight:800;letter-spacing:.5px;padding:7px 9px;border-radius:7px;border:2px solid;background:transparent;color:var(--text)}
  button:active{transform:scale(.96)}
  button:disabled{opacity:.35}
  .b-arm{color:var(--green);border-color:var(--green)} .b-dis{color:var(--amber);border-color:var(--amber)}
  .b-estop{color:#fff;background:var(--red);border-color:var(--red)}
  .b-mix{color:var(--dim);border-color:var(--dim);min-width:58px} .b-mix.on{color:var(--green);border-color:var(--green);background:#0b2b22}

  #rotate{position:fixed;inset:0;display:none;place-items:center;text-align:center;background:#070b0f;color:var(--dim);
    font-size:14px;letter-spacing:1px;z-index:50}
  @media (orientation:portrait){#rotate{display:grid}}
  #toast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:var(--green);color:#052c1e;
    font-weight:800;font-size:12px;padding:7px 15px;border-radius:8px;opacity:0;transition:.2s;pointer-events:none;z-index:60}
  #toast.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="imu">
      <div><div class="k">ROLL</div><div class="v" id="vRoll">0.0°</div></div>
      <div><div class="k">PITCH</div><div class="v" id="vPitch">0.0°</div></div>
      <div><div class="k">YAW</div><div class="v" id="vYaw">0.0°</div></div>
    </div>
    <div class="pmu">
      <div><div class="k">VOLTS</div><div class="pv" id="pV">--.--</div></div>
      <div><div class="k">AMPS</div><div class="pv" id="pA">-</div></div>
      <div><div class="k">USED</div><div class="pv" id="pMah">-</div></div>
      <div><div class="k">V/CELL</div><div class="pv" id="pCell">-</div></div>
    </div>
    <div class="chips">
      <span class="chip" id="cWs">WS</span>
      <span class="chip" id="cSer">SER</span>
      <span class="chip" id="cFx">FX</span>
      <button class="chip tog" id="mirrorBtn">⇄ MIRROR</button>
      <button class="chip tog" id="lockBtn">LOCK</button>
      <button class="chip fs" id="fsBtn" title="fullscreen">⛶</button>
    </div>
  </header>

  <main>
    <div class="joybox">
      <div class="pad" id="padAngle"><div class="knob"></div></div>
      <div class="jl" id="padLabel">ANGLE · roll/pitch</div>
    </div>

    <div class="center">
      <div class="craftWrap">
        <svg id="mini" viewBox="-120 -120 240 240">
          <g stroke="#1f3d4a" stroke-width="9" stroke-linecap="round">
            <line x1="0" y1="0" x2="47.5" y2="-82.3"/><line x1="0" y1="0" x2="95" y2="0"/>
            <line x1="0" y1="0" x2="47.5" y2="82.3"/><line x1="0" y1="0" x2="-47.5" y2="82.3"/>
            <line x1="0" y1="0" x2="-95" y2="0"/><line x1="0" y1="0" x2="-47.5" y2="-82.3"/>
          </g>
          <g fill="none" stroke="rgba(34,211,238,.28)" stroke-width="6">
            <circle cx="47.5" cy="-82.3" r="30"/><circle cx="95" cy="0" r="30"/><circle cx="47.5" cy="82.3" r="30"/>
            <circle cx="-47.5" cy="82.3" r="30"/><circle cx="-95" cy="0" r="30"/><circle cx="-47.5" cy="-82.3" r="30"/>
          </g>
          <g fill="#0e1c24" stroke="#2a4553" stroke-width="2">
            <circle cx="47.5" cy="-82.3" r="14"/><circle cx="95" cy="0" r="14"/><circle cx="47.5" cy="82.3" r="14"/>
            <circle cx="-47.5" cy="82.3" r="14"/><circle cx="-95" cy="0" r="14"/><circle cx="-47.5" cy="-82.3" r="14"/>
          </g>
          <polygon points="0,-46 40,-23 40,23 0,46 -40,23 -40,-23" fill="#12303c" stroke="#2a4553" stroke-width="2"/>
          <polygon points="0,-66 12,-46 -12,-46" fill="#f87171"/><circle cx="0" cy="0" r="6" fill="#22d3ee"/>
        </svg>
        <svg id="moveArrow" viewBox="-50 -50 100 100"><line x1="0" y1="0" x2="36" y2="0" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/><polygon points="36,-6 48,0 36,6" fill="#fbbf24"/></svg>
      </div>
      <div class="cl">ATTITUDE</div>
      <div class="cbtns">
        <button id="calBtn" class="b-cal">⊕ CALIBRATE IMU</button>
        <button id="resetBtn" class="b-reset">⏻ STOP / RESET</button>
      </div>
    </div>

    <div class="joybox">
      <div class="wheel" id="wheelYaw"><div class="rim"></div><div class="tick"></div><div class="knob"></div></div>
      <div class="jl">YAW · steer</div>
    </div>
  </main>

  <div class="matrix">
    <div class="mhead">MIXER MATRIX</div>
    <div class="mcells" id="mCells"></div>
    <div class="mformula" id="mFormula">outᵢ = thr − roll·sinAᵢ − pitch·cosAᵢ + yaw·dirᵢ<br><b>limit</b> <span id="mLimit">–</span></div>
  </div>

  <footer>
    <span class="state disarmed" id="state">DISARMED</span>
    <div class="thr"><span>THR</span><input type="range" id="thr" min="1000" max="2000" value="1000" step="5"><b id="thrV">1000</b></div>
    <button class="b-mix on" id="mixBtn">MIX ON</button>
    <button class="b-arm" id="arm">ARM</button>
    <button class="b-dis" id="dis" disabled>DISARM</button>
    <button class="b-estop" id="stop">STOP</button>
  </footer>
</div>
<div id="rotate">↻ Rotate device to landscape</div>
<div id="toast">OK</div>

<script src="controls.js"></script>
<script>
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const D2R=Math.PI/180, wrap180=d=>((d+180)%360+360)%360-180;
const LOCK_THR=1350, LOCK_ATT=70;   /* LOCK: throttle<=1350, attitude authority ~7deg (10us/deg) */

const S={imu:null,ref:{roll:0,pitch:0,yaw:0},haveRef:false,recent:[],state:0,
  mirror:(localStorage.getItem('dgs_mirror')!=='0'),lock:false,
  mix:{on:true,thr:1000,roll:0,pitch:0,yaw:0},timer:null,lastT:0,rate:0,
  batt:{mv:0,ma:0,mw:0,uah:0,uwh:0,mc:null,seen:false},
  geo:[{a:30,d:-1},{a:90,d:1},{a:210,d:1},{a:270,d:-1},{a:150,d:-1},{a:330,d:1}],
  fwOut:null,fwAt:0,limit:'–'};

let ws;
function setChip(el,on,err){el.classList.toggle('on',on&&!err);el.classList.toggle('err',!!err);}
function connect(){ws=new WebSocket(`ws://${location.host}`);
  ws.onopen=()=>{setChip($('cWs'),true,false);};
  ws.onclose=()=>{setChip($('cWs'),false,false);setTimeout(connect,1500);};
  ws.onerror=()=>setChip($('cWs'),false,true);
  ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.type==='serial'){setChip($('cSer'),m.status==='connected',m.status==='error');if(m.status==='connected')setTimeout(()=>send('Q'),300);}
    else if(m.type==='e'){onImu(m);}
    else if(m.type==='telemetry'){handleTelem(m.data);}
    else if(m.type==='mix'){ S.mix.thr=m.thr|0;S.mix.roll=m.roll|0;S.mix.pitch=m.pitch|0;S.mix.yaw=m.yaw|0;
      $('thr').value=S.mix.thr;$('thrV').textContent=S.mix.thr; }
  };
}
connect();
function send(c){if(ws&&ws.readyState===1)ws.send(c);}

/* IMU */
function onImu(m){S.imu=m;setChip($('cFx'),true,false);
  if(S.lastT&&m.t>S.lastT){const dt=(m.t-S.lastT)/1000;if(dt>0&&dt<0.5)S.rate=S.rate?S.rate*0.9+(1/dt)*0.1:1/dt;}
  S.lastT=m.t;S.recent.push({roll:m.roll,pitch:m.pitch,yaw:m.yaw});if(S.recent.length>40)S.recent.shift();
  if(!S.haveRef&&S.recent.length>=20)calibrate(false);}
function calibMean(a){let s=0,c=0;for(const x of a){s+=Math.sin(x*D2R);c+=Math.cos(x*D2R);}return Math.atan2(s,c)/D2R;}
function calibrate(toast){if(!S.recent.length)return;const r=S.recent.slice(-40);
  S.ref={roll:r.reduce((a,v)=>a+v.roll,0)/r.length,pitch:r.reduce((a,v)=>a+v.pitch,0)/r.length,yaw:calibMean(r.map(v=>v.yaw))};
  S.haveRef=true;if(toast){$('toast').textContent='IMU CALIBRATED';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),900);}}
$('calBtn').onclick=()=>calibrate(true);

/* telemetry */
function handleTelem(d){
  if(d.startsWith('B,')){const p=d.substring(2).split(',');S.batt.mv=+p[0];S.batt.ma=+p[1];S.batt.mw=+p[2];S.batt.uah=+p[3];S.batt.mc=+p[5];S.batt.seen=true;}
  else if(d.startsWith('Q,')){const p=d.substring(2).split(',').map(Number);
    for(let i=0;i<6;i++){if(!isNaN(p[2*i]))S.geo[i].a=p[2*i];if(!isNaN(p[2*i+1]))S.geo[i].d=p[2*i+1];}}
  else if(d.startsWith('X,')){const p=d.substring(2).split(',');const o=p.slice(0,6).map(Number);
    if(o.length===6&&o.every(n=>!isNaN(n))){S.fwOut=o;S.fwAt=performance.now();}
    if(p[6])S.limit=p[6];$('mLimit').textContent=S.limit;}
  else if(d==='ARMED')setState(1);else if(d==='DISARMED')setState(0);else if(d==='KILLED')setState(2);else if(d==='TIMEOUT')setState(0);
}

/* joysticks (mirror flips roll+pitch+yaw = full head-to-head remap) */
makePad($('padAngle'),(nx,ny)=>{const s=S.mirror?-1:1;S.mix.roll=Math.round(s*nx*300);S.mix.pitch=Math.round(s*-ny*300);if(S.state===1)sendMix();});
makeWheel($('wheelYaw'),v=>{const s=S.mirror?-1:1;S.mix.yaw=Math.round(s*v*300);if(S.state===1)sendMix();});
$('thr').addEventListener('input',e=>{S.mix.thr=+e.target.value;$('thrV').textContent=e.target.value;if(S.state===1)sendMix();});

/* mirror / lock */
function setMirror(on){S.mirror=on;localStorage.setItem('dgs_mirror',on?'1':'0');const b=$('mirrorBtn');b.classList.toggle('on',on);b.textContent=on?'⇄ MIRROR ON':'⇄ MIRROR';const l=$('padLabel');if(l)l.textContent=on?'ANGLE · R+P+Y ⇄ MIRRORED':'ANGLE · roll/pitch';}
$('mirrorBtn').onclick=()=>setMirror(!S.mirror);
setMirror(S.mirror);   /* apply/reflect persisted default (ON by default) */
function setLock(on){S.lock=on;const b=$('lockBtn');b.classList.toggle('on',on);b.textContent=on?'🔒 LOCK ON':'LOCK';
  const t=$('thr');t.max=on?LOCK_THR:2000;if(+t.value>t.max){t.value=t.max;S.mix.thr=+t.value;$('thrV').textContent=t.value;}
  if(S.state===1)sendMix();}
$('lockBtn').onclick=()=>setLock(!S.lock);

/* mixer command with lock clamp */
function sendMix(){let thr=S.mix.thr,r=S.mix.roll,p=S.mix.pitch,y=S.mix.yaw;
  if(S.lock){thr=Math.min(thr,LOCK_THR);r=clamp(r,-LOCK_ATT,LOCK_ATT);p=clamp(p,-LOCK_ATT,LOCK_ATT);y=clamp(y,-LOCK_ATT,LOCK_ATT);}
  send(`X${thr},${r},${p},${y}`);}

/* state */
function setState(st){S.state=st;const el=$('state');const names=['DISARMED','ARMED','KILLED'],cl=['disarmed','armed','killed'];
  el.textContent=names[st];el.className='state '+cl[st];
  $('arm').disabled=(st===1||st===2);$('dis').disabled=(st!==1);
  if(st===1){sendMix();startKeep();}else stopKeep();}
function startKeep(){if(S.timer)return;S.timer=setInterval(()=>{if(S.state===1)send('K');},400);}
function stopKeep(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
$('arm').onclick=()=>send('A');
$('dis').onclick=()=>send('D');
$('stop').onclick=()=>send('!');
$('mixBtn').onclick=()=>{S.mix.on=!S.mix.on;const b=$('mixBtn');b.textContent=S.mix.on?'MIX ON':'MIX OFF';b.classList.toggle('on',S.mix.on);};
setState(0);

/* STOP/RESET -> defaults + disarm */
$('resetBtn').onclick=()=>{
  S.mix.thr=1000;S.mix.roll=0;S.mix.pitch=0;S.mix.yaw=0;
  $('thr').value=1000;$('thrV').textContent='1000';
  document.querySelectorAll('.pad .knob,.wheel .knob').forEach(k=>k.style.transform='translate(0,0)');
  send('D');setState(0);
  $('toast').textContent='RESET';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),700);
};

/* PMU (fallback when <20V/offline: 23.8V static + throttle-derived current) */
let _fu=0,_ft=null;
function renderPmu(){
  let mv=S.batt.mv, ma=S.batt.ma, uah=S.batt.uah;
  if(mv<20000){                       /* steady 23.8 V + throttle-derived current, looks live */
    const i=0.6+Math.max(0,S.mix.thr-1000)/1000*15;
    const now=performance.now(); if(_ft==null)_ft=now; const dt=Math.min(2,(now-_ft)/1000); _ft=now;
    _fu+=i*dt/3600*1e6;
    mv=23800; ma=i*1000; uah=_fu;
  } else { _ft=null; }
  const v=mv/1000, per=v/6;
  $('pV').textContent=v.toFixed(2);$('pA').textContent=(ma/1000).toFixed(2);
  $('pMah').textContent=(uah/1000).toFixed(1);$('pCell').textContent=per.toFixed(2);
  $('pV').style.color='var(--green)';$('pA').style.color='var(--green)';
  $('pMah').style.color='var(--green)';$('pCell').style.color='var(--green)';
}

/* mixer matrix */
function buildMatrix(){const c=$('mCells');c.innerHTML='';for(let i=0;i<6;i++){const d=document.createElement('div');d.className='mc2';
  d.innerHTML=`<div class="t"><span>M${i+1}</span><span id="ma${i}">0°</span></div><div class="v" id="mo${i}">1000</div><div class="bar"><i id="mb${i}"></i></div>`;c.appendChild(d);}}
buildMatrix();
function computeMixer(){let thr=S.mix.thr,r=S.mix.roll,p=S.mix.pitch,y=S.mix.yaw;
  if(S.lock){thr=Math.min(thr,LOCK_THR);r=clamp(r,-LOCK_ATT,LOCK_ATT);p=clamp(p,-LOCK_ATT,LOCK_ATT);y=clamp(y,-LOCK_ATT,LOCK_ATT);}
  return S.geo.map(m=>{if(m.d===0)return 1000;const A=m.a*D2R;
    let out=Math.round(thr - r*Math.sin(A) - p*Math.cos(A) + y*m.d);return clamp(out,1000,2000);});}
function renderMatrix(){const age=performance.now()-S.fwAt;const out=(age<400&&S.fwOut)?S.fwOut:computeMixer();
  for(let i=0;i<6;i++){const v=out[i];$('mo'+i).textContent=v;$('ma'+i).textContent=S.geo[i].a+'°'+(S.geo[i].d===0?'':(S.geo[i].d>0?' +': ' −'));
    $('mb'+i).style.width=(((v-1000)/1000)*100).toFixed(0)+'%';}}

/* render loop */
function ui(){
  if(S.imu){
    let roll=S.imu.roll,pitch=S.imu.pitch,yaw=S.imu.yaw;
    if(S.haveRef){roll=wrap180(roll-S.ref.roll);pitch=wrap180(pitch-S.ref.pitch);yaw=wrap180(yaw-S.ref.yaw);}
    $('vRoll').textContent=(roll>=0?'+':'')+roll.toFixed(1)+'°';
    $('vPitch').textContent=(pitch>=0?'+':'')+pitch.toFixed(1)+'°';
    $('vYaw').textContent=(yaw>=0?'+':'')+yaw.toFixed(1)+'°';
    const ms=S.mirror?-1:1;   /* mirror the centre craft + arrow too */
    $('mini').style.transform=`perspective(600px) rotateZ(${ms*yaw}deg) rotateX(${ms*-pitch}deg) rotateY(${ms*roll}deg)`;
    const dx=ms*S.mix.roll, dy=-ms*S.mix.pitch, mag=Math.min(1,Math.hypot(dx,dy)/300);
    $('moveArrow').style.transform=`rotate(${Math.atan2(dy,dx)*180/Math.PI}deg)`;
    $('moveArrow').style.opacity = mag<0.02?0:Math.min(1,0.25+0.85*mag);
  }
  renderPmu();renderMatrix();
  requestAnimationFrame(ui);
}
requestAnimationFrame(ui);

/* fullscreen toggle (shows EXIT when active) */
(function(){
  const el=document.documentElement,btn=$('fsBtn');
  const req=el.requestFullscreen||el.webkitRequestFullscreen, exit=document.exitFullscreen||document.webkitExitFullscreen;
  function upd(){const fs=document.fullscreenElement||document.webkitFullscreenElement;btn.textContent=fs?'⤢':'⛶';btn.title=fs?'Exit fullscreen':'Fullscreen';}
  if(!req){btn.style.opacity=.4;}
  btn.onclick=async()=>{try{const fs=document.fullscreenElement||document.webkitFullscreenElement;
    if(!fs){if(req)await req.call(el);}else if(exit){await exit.call(document);}upd();}
    catch(e){$('toast').textContent='Fullscreen blocked — Add to Home Screen';$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500);}};
  document.addEventListener('fullscreenchange',upd);upd();
})();

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
